# eraTHYMKR web runtime -> GitHub Pages (fixed HTTPS) deploy.
# Publishes the prebuilt tools/web-engine-probe/pwa-dist/ as-is.
# CI does NOT rebuild (so it works without the eraJS source / dist checked in).
# When you change the game or engine, run `npm run build:pwa` locally and
# commit the updated pwa-dist/ before pushing.
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "tools/web-engine-probe/pwa-dist/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments; do not cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload prebuilt pwa-dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools/web-engine-probe/pwa-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
