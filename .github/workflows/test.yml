name: Test server runtime

on:
  push:
    branches: [server]
  pull_request:
    branches: [server]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install root project
        run: npm ci

      - name: Run deterministic runtime tests
        run: npm test
